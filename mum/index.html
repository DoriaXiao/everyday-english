<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>每天学一点英语</title>
<style>
:root { --ink:#1f2a24; --muted:#5d6a62; --paper:#fbfaf5; --card:#fff; --line:#dcd9cc; --green:#2c6e49; --soft:#e6f1ea; --red:#b3392f; --redsoft:#f8e3e0; --yellow:#fff6d9 }
[hidden] { display:none !important }
* { box-sizing:border-box } body { margin:0; background:var(--paper); color:var(--ink); font:19px/1.6 -apple-system,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif }

<section class="inbox" id="inbox" hidden></section>

<p class="muted">不用写字，听一听，跟着说。说错了没关系。</p>
<p class="muted" style="font-size:16px" id="privacy">你的录音和打卡只发给你家的孩子。网站管理员也能看到这些记录，平时只看统计（比如多少人在学、学到第几天），用来改进课程。</p>

你了。", "audio/729138fc2311.mp3"]], "review": false}, {"title": "买衣服", "tip": "店员过来问，不想买就说 Just looking, thanks（随便看看）。想试衣服就问 Can I try this on?。", "say": [["Just looking, thanks.", "随便看看，谢谢。", "贾斯特 卢金，三克斯", "audio/cb0a2b8e1276.mp3"], ["Can I try this on?", "我能试试这件吗？", "砍 爱 翠 迪斯 昂", "audio/bcd5f2a1a7b0.mp3"], ["A bigger one, please.", "要大一号的。", "呃 比格 万，普力斯", "audio/dd980e987f0b.mp3"], ["A smaller one, please.", "要小一号的。", "呃 斯莫勒 万，普力斯", "audio/26364fcc240d.mp3"], ["I'll take it.", "我买了。", "爱尔 忒克 意特", "audio/128c56257c51.mp3"]], "hear": [{"q": ["Can I help you?", "需要帮忙吗？", "audio/8defda9c95cb.mp3"], "a": ["Just looking, thanks.", "随便看看，谢谢。", "贾斯特 卢金，三克斯", "audio/cb0a2b8e1276.mp3"]}, {"q": ["Does it fit?", "合身吗？", "audio/e60c3833f8b3.mp3"], "a": ["Yes. I'll take it.", "合身，我买了。", "耶斯。爱尔 忒克 意特", "audio/16bb8ef01083.mp3"]}], "talk": [["them", "Hi, can I help you?", "你好，需要帮忙吗？", "audio/6cdd835ef530.mp3"], ["me", "Can I try this on?", "我能试试这件吗？", "audio/bcd5f2a1a7b0.mp3"], ["them", "Sure. The fitting room is over there.", "可以，试衣间在那边。", "audio/156da3376ba1.mp3"], ["me", "A bigger one, please.", "要大一号的。", "audio/dd980e987f0b.mp3"], ["them", "Here you go. Does it fit?", "给你。合身吗？", "audio/8c85af9172c0.mp3"], ["me", "Yes. I'll take it.", "合身，我买了。", "audio/16bb8ef01083.mp3"]], "review": false}, {"title": "澳洲人常说的话", "tip": "你说谢谢，澳洲人常回 No worries（没事、不客气）。Cheers 可以当“谢谢”，也可以当“干杯”。不小心碰到人，说 Sorry! 就好。", "say": [["No worries.", "没事，不客气。", "诺 沃瑞斯", "audio/6fac77e3c077.mp3"], ["Cheers.", "谢啦。", "七尔斯", "audio/31d7452effdc.mp3"], ["Sorry!", "对不起！", "搜瑞", "audio/3d5146ec9959.mp3"], ["That's okay.", "没关系。", "黛次 欧克伊", "audio/8a9af4ac474e.mp3"], ["Have a good day.", "祝你今天愉快。", "黑夫 呃 古德 得", "audio/6ccd270ae1b5.mp3"]], "hear": [{"q": ["Thank you!", "谢谢你！", "audio/2a55d4a232ae.mp3"], "a": ["No worries.", "不客气。", "诺 沃瑞斯", "audio/6fac77e3c077.mp3"]}, {"q": ["Oh, sorry!", "哦，对不起！", "audio/ecd5f9d46540.mp3"], "a": ["That's okay.", "没关系。", "黛次 欧克伊", "audio/8a9af4ac474e.mp3"]}], "talk": [["me", "Excuse me. Where is the toilet?", "打扰一下，厕所在哪里？", "audio/d7a2890db338.mp3"], ["them", "It's over there.", "在那边。", "audio/8f9483d86863.mp3"], ["me", "Cheers.", "谢啦。", "audio/31d7452effdc.mp3"], ["them", "No worries. Have a good day!", "不客气，祝你今天愉快！", "audio/0c4f12bcd287.mp3"], ["me", "Thank you. Have a good day.", "谢谢，祝你今天愉快。", "audio/b17185297b02.mp3"]], "review": false}, {"title": "告别", "tip": "回国前跟邻居、家人的朋友道个别，说一句谢谢照顾，大家都会很高兴。", "say": [["I'm going home next week.", "我下周回国了。", "爱姆 够应 霍姆 奈克斯特 维克", "audio/81a0117d1c40.mp3"], ["Thank you for everything.", "谢谢你们的照顾。", "三Q 佛 爱乌瑞辛", "audio/5d5f70d6f879.mp3"], ["I'll miss you.", "我会想你们的。", "爱尔 米斯 优", "audio/c558e83c3e81.mp3"], ["Come to China!", "来中国玩吧！", "卡姆 吐 柴那", "audio/e44b5ec6161d.mp3"], ["Take care.", "保重。", "忒克 凯尔", "audio/5692215724d0.mp3"]], "hear": [{"q": ["When are you going home?", "你什么时候回国？", "audio/4749af953c6a.mp3"], "a": ["I'm going home next week.", "我下周回国了。", "爱姆 够应 霍姆 奈克斯特 维克", "audio/81a0117d1c40.mp3"]}, {"q": ["We'll miss you!", "我们会想你的！", "audio/6ccd202179da.mp3"], "a": ["I'll miss you too. Take care.", "我也会想你们的，保重。", "爱尔 米斯 优 吐。忒克 凯尔", "audio/89068a67cc20.mp3"]}], "talk": [["them", "When are you going home?", "你什么时候回国？", "audio/4749af953c6a.mp3"], ["me", "I'm going home next week.", "我下周回国了。", "audio/81a0117d1c40.mp3"], ["them", "Oh no! We'll miss you.", "哎呀！我们会想你的。", "audio/09b99394b673.mp3"], ["me", "Thank you for everything.", "谢谢你们的照顾。", "audio/5d5f70d6f879.mp3"], ["them", "Come back soon!", "早点再来！", "audio/f531d51159fb.mp3"], ["me", "Come to China! Take care.", "来中国玩吧！保重。", "audio/5d8f9d5ff36f.mp3"]], "review": false}, {"title": "复习", "tip": "今天没有新句子。复习这一周的句子，最后的对话是跟邻居说自己不舒服，试试把学过的串起来说。", "say": [["I have a cough.", "我咳嗽。", "爱 黑夫 呃 考夫", "audio/6148a1a75a18.mp3"], ["How many stops?", "要坐几站？", "好 麦尼 斯道普斯", "audio/4aec26c2a5c5.mp3"], ["Can you take a photo for us?", "能帮我们拍张照吗？", "砍 优 忒克 呃 佛头 佛 阿斯", "audio/4210c17c068c.mp3"], ["Just looking, thanks.", "随便看看，谢谢。", "贾斯特 卢金，三克斯", "audio/cb0a2b8e1276.mp3"], ["No worries.", "没事，不客气。", "诺 沃瑞斯", "audio/6fac77e3c077.mp3"], ["Thank you for everything.", "谢谢你们的照顾。", "三Q 佛 爱乌瑞辛", "audio/5d5f70d6f879.mp3"]], "hear": [{"q": ["Any allergies?", "有没有过敏？", "audio/fd10a212989c.mp3"], "a": ["No allergies.", "我没有过敏。", "诺 艾勒基斯", "audio/ae053f460abd.mp3"]}, {"q": ["Does it fit?", "合身吗？", "audio/e60c3833f8b3.mp3"], "a": ["Yes. I'll take it.", "合身，我买了。", "耶斯。爱尔 忒克 意特", "audio/16bb8ef01083.mp3"]}], "talk": [["them", "Hi! How are you going?", "嗨！你好吗？", "audio/5a65b2c061bb.mp3"], ["me", "I don't feel well. I have a cough.", "我不太舒服，我咳嗽。", "audio/80f8a0735c62.mp3"], ["them", "Oh no. How long have you had it?", "哎呀，多久了？", "audio/e2fd01279460.mp3"], ["me", "Two days.", "两天了。", "audio/31ee11566bcb.mp3"], ["them", "Take care!", "多保重！", "audio/137a2d640d0f.mp3"], ["me", "Thank you. Have a good day.", "谢谢，祝你今天愉快。", "audio/b17185297b02.mp3"]], "review": true}]</script>
<script>
(function () {
  var RAW = JSON.parse(document.getElementById('data').textContent), SB = 'https://rrmfujomfedxxnchfcgi.supabase.co', SBK = 'sb_publishable_Jlfc5BOhR-UtmNmNc_FdjA_MImfGAfW';
  function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem('mum-' + k)); localStorage.setItem('mum-' + k, JSON.stringify(v)); } catch (e) { return null; } }
  // sentences that depend on the family's settings (who she visits, how long she stays) come in variants
  var fam = store('family') || {}, DEFAULTS = { who: 'family', stay: '1m' };
  function resolve(x) { if (Array.isArray(x)) return x.map(resolve); if (x && typeof x === 'object') { if (x._var) return resolve(x.opts[fam[x._var]] || x.opts[DEFAULTS[x._var]]); var o = {}; for (var k in x) o[k] = resolve(x[k]); return o; } return x; }
  var DAYS = resolve(RAW);
  function esc(t) { var d = document.createElement('div'); d.textContent = t; return d.innerHTML; }
  var msgEl = document.createElement('div'); msgEl.className = 'msg'; msgEl.hidden = true; msgEl.setAttribute('aria-live', 'polite'); document.body.appendChild(msgEl);
  var timer; function note(t, keep) { msgEl.textContent = t; msgEl.hidden = false; clearTimeout(timer); if (!keep) timer = setTimeout(function () { msgEl.hidden = true; }, 4000); }
  var player = new Audio(), seq = 0;
  function soundErr(e) { if (!e || e.name !== 'AbortError') note('放不出声音，看看手机音量'); }  // AbortError = cut off by the next sound, not a fault
  // 听整段 repeats until she taps it again (it reads 停止 while playing); any other sound or step stops it
  var looping = false;
  function endLoop() { looping = false; var b = document.getElementById('talk-all'); if (b) { b.textContent = '听整段'; b.classList.remove('on'); } }
  function play(src, rate) { endLoop(); endBg(); seq++; clearLine(); player.onended = null; player.src = src; player.playbackRate = rate || 1; return player.play().catch(soundErr); }
  function stopAll() { endLoop(); endBg(); stopRec(); seq++; clearLine(); player.onended = null; player.pause(); }
  // dialogue: play the lines in turn; with mine = true her lines are left as a pause for her to say them
  function clearLine() { document.querySelectorAll('.line.now').forEach(function (l) { l.classList.remove('now'); }); }
  function runTalk(mine) { stopAll(); var my = seq, lines = DAYS[cur].talk, els = document.querySelectorAll('.line');
    if (!mine) { looping = true; var b = document.getElementById('talk-all'); if (b) { b.textContent = '停止'; b.classList.add('on'); } }
    function step(j) { if (msgEl.textContent === '轮到你说了') msgEl.hidden = true; if (my !== seq) return; clearLine(); if (j >= lines.length) { if (!mine) { setTimeout(function () { if (my === seq) step(0); }, 1500); return; } note('演完了，点「听整段」对一对'); return; }
      els[j].classList.add('now'); var l = lines[j];
      if (mine && l[0] === 'me') { note('轮到你说了', true); setTimeout(function () { step(j + 1); }, 2500 + 700 * l[1].split(' ').length); return; }
      player.src = l[3]; player.playbackRate = 1; player.onended = function () { player.onended = null; setTimeout(function () { step(j + 1); }, 500); };
      player.play().catch(soundErr); }
    step(0); }

  // 干活时听: the open day's sentences, questions and dialogue, each said twice, over and over until 停止.
  // The screen is kept on where the browser allows it, because a locked phone stops the sound.
  var bg = false, bgAt = 0, wake = null;
  function bgItems(i) { var d = DAYS[i], out = [];
    d.say.forEach(function (s) { out.push([s[0], s[1], s[3]]); });
    d.hear.forEach(function (h) { out.push([h.q[0], h.q[1], h.q[2]], [h.a[0], h.a[1], h.a[3]]); });
    d.talk.forEach(function (l) { out.push([l[1], l[2], l[3]]); }); return out; }
  function renderBg(it) { var el = document.getElementById('bg'); el.className = 'bg' + (bg ? ' on' : '');
    el.innerHTML = bg ? '<div class="kind">正在放第 ' + (cur + 1) + ' 天的句子，每句两遍</div>' + (it ? '<div class="en">' + esc(it[0]) + '</div><div class="zh">' + esc(it[1]) + '</div>' : '') +
        '<div class="btns"><button type="button" class="listen on" id="bg-stop">停止</button></div><p class="hint">手机屏幕别关，放在旁边就行。</p>'
      : '<div class="btns"><button type="button" class="listen" id="bg-start">🎧 干活时听</button></div><p class="hint">把今天这课的句子一遍遍放，每句说两遍。做饭、收拾的时候听。</p>'; }
  function endBg() { if (!bg) return; bg = false; if (wake) { wake.release().catch(function () {}); wake = null; } renderBg(); }
  function runBg(from) { stopAll(); bg = true; var my = seq, list = bgItems(cur);
    if (navigator.wakeLock && !wake) navigator.wakeLock.request('screen').then(function (w) { if (bg) wake = w; else w.release(); }).catch(function () {});
    function step(j, rep) { if (my !== seq) return; if (j >= list.length) j = 0; bgAt = j; var it = list[j]; renderBg(it);
      player.src = it[2]; player.playbackRate = 1;
      player.onended = function () { player.onended = null; setTimeout(function () { if (rep === 0) step(j, 1); else step(j + 1, 0); }, rep === 0 ? 1500 : 2500); };
      player.play().catch(soundErr); }
    step(from || 0, 0); }

  // same anonymous sign-in and tables as the main course, marked course = 'mum'
  function api(path, o) { o = o || {}; var h = { apikey: SBK, 'Content-Type': 'application/json' }; if (o.token) h.Authorization = 'Bearer ' + o.token; if (o.prefer) h.Prefer = o.prefer;
    return fetch(SB + path, { method: o.method || 'GET', headers: h, body: o.body ? JSON.stringify(o.body) : undefined, cache: 'no-store' }).then(function (r) { return r.text().then(function (t) { if (!r.ok) { var e = new Error('http'); e.status = r.status; throw e; } return t ? JSON.parse(t) : null; }); }); }
  function retry(fn) { return fn().catch(function (e) { if (e.status && e.status < 500) throw e; return new Promise(function (r) { setTimeout(r, 1500); }).then(fn); }); }
  function token(create) { var s = store('session'), save = function (d) { store('session', { access_token: d.access_token, refresh_token: d.refresh_token, expires_at: Date.now() / 1000 + (d.expires_in || 3600) }); return d.access_token; };
    if (s && s.expires_at - 60 > Date.now() / 1000) return Promise.resolve(s.access_token);
    if (s && s.refresh_token) return retry(function () { return api('/auth/v1/token?grant_type=refresh_token', { method: 'POST', body: { refresh_token: s.refresh_token } }); }).then(save);
    if (!create) return Promise.resolve(null);
    return retry(function () { return api('/auth/v1/signup', { method: 'POST', body: {} }); }).then(save); }
  function uid(t) { return JSON.parse(atob(t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))).sub; }
  var rows = [];
  // this person's phones: this one plus any other phone in the family with the same name (a new phone for the same parent)
  function myIds(t) { return api('/rest/v1/rpc/family_members', { method: 'POST', token: t, body: {} }).catch(function () { return []; }).then(function (ms) {
    var me = fam.name || fam.parent_name, ids = [uid(t)]; (ms || []).forEach(function (m) { if (m.role === 'learner' && (m.name || fam.parent_name) === me) ids.push(m.user_id); }); return ids; }); }
  function loadMine() { return token(false).then(function (t) { if (!t) return; return retry(function () { return Promise.all([api('/rest/v1/submissions?select=id,user_id,day,text,reply,reply_audio&course=eq.mum&order=created_at.asc', { token: t }), myIds(t)]); })
    .then(function (res) { rows = (res[0] || []).filter(function (r) { return res[1].indexOf(r.user_id) >= 0; }); renderInbox(); showReplies(); }); }).catch(function () {}); }
  function renderInbox() { var seen = store('seen') || [], fresh = rows.filter(function (r) { return r.reply && seen.indexOf(r.id) < 0; }), box = document.getElementById('inbox');
    box.hidden = !fresh.length; if (!fresh.length) return;
    box.innerHTML = '<h2>有 ' + fresh.length + ' 条新回复</h2>' + fresh.map(function (r) { return '<div><b>' + esc(r.text) + '</b><br>' + esc(r.reply) + voiceBtn(r) + '</div>'; }).join('') + '<button class="big" type="button" id="seen">知道了</button>';
    document.getElementById('seen').onclick = function () { store('seen', seen.concat(fresh.map(function (r) { return r.id; }))); box.hidden = true; }; }
  function showReplies() { document.querySelectorAll('[data-replies]').forEach(function (b) { var en = b.getAttribute('data-replies'); b.innerHTML = rows.filter(function (r) { return r.text === en && r.reply; }).map(function (r) { return '<div class="reply">' + esc(r.reply) + voiceBtn(r) + '</div>'; }).join(''); }); }
  function voiceBtn(r) { return r.reply_audio ? '<div class="btns" style="margin-top:6px"><button type="button" class="listen" data-ra="' + esc(r.reply_audio) + '">听孩子说的</button></div>' : ''; }
  function playStored(path) { token(false).then(function (t) { return fetch(SB + '/storage/v1/object/authenticated/recordings/' + path, { headers: { apikey: SBK, Authorization: 'Bearer ' + t } }); })
    .then(function (r) { if (!r.ok) throw new Error('http'); return r.blob(); }).then(function (b) { play(URL.createObjectURL(b)); }).catch(function () { note('放不出来，等网好一点再试'); }); }

  // family: the link from the child carries ?f=<code>; the phone joins that family on first open. The plain
  // link without ?f is "learn on your own": no family, nothing leaves the phone (so a parent can forward it
  // to friends). If this phone has no progress (new phone, cleared browser), the family's check-ins bring it back.
  // A family can have several parents (mum and dad): the link may carry ?n=<name>, saved on the server for
  // this phone so the child sees who learned what. No name means the family's parent_name.
  var params = new URLSearchParams(location.search), nm = (params.get('n') || '').trim().slice(0, 10);
  var solo = !fam.code && !params.get('f');
  function setupFamily() { if (solo) return Promise.resolve(); var f = params.get('f'), fresh = !fam.code || (f && f !== fam.code), rename = nm && nm !== fam.name;
    return token(true).then(function (t) {
      return retry(function () { return api('/rest/v1/rpc/join_family', { method: 'POST', token: t, body: fresh || rename ? { p_code: f || fam.code, p_name: nm || null } : {} }); })
        .then(function (info) { return info || fresh ? info : api('/rest/v1/rpc/join_family', { method: 'POST', token: t, body: { p_code: fam.code, p_name: fam.name || null } }); })
        .then(function (info) { if (!info) return; var changed = info.who !== fam.who || info.stay !== fam.stay; fam = info; store('family', info); if (changed) DAYS = resolve(RAW);
          return recover(t).then(function (moved) { if (moved) { cur = firstOpen(); openDay(cur); } else if (changed) openDay(cur, pos); }); });
    }).catch(function () {}); }
  // only this person's check-ins (same name), not the other parent's
  function recover(t) { if (log.length) return Promise.resolve(false);
    return Promise.all([api('/rest/v1/checkins?select=user_id,day,on_date&course=eq.mum&order=on_date.asc', { token: t }), myIds(t)]).then(function (res) {
      var r = (res[0] || []).filter(function (c) { return res[1].indexOf(c.user_id) >= 0; }); if (!r.length) return false;
      r.forEach(function (c) { if (!log.some(function (x) { return x.date === c.on_date && x.day === c.day; })) log.push({ date: c.on_date, day: c.day }); if (done.indexOf(c.day - 1) < 0) done.push(c.day - 1); });
      store('log', log); store('done', done); renderLog(); return true; }).catch(function () { return false; }); }
  function firstOpen() { var i = 0; while (i < DAYS.length - 1 && done.indexOf(i) >= 0) i++; return i; }

  // check-ins: kept on the phone and sent to the shared table, so a missed upload is retried later
  function today() { var d = new Date(), p = function (n) { return (n < 10 ? '0' : '') + n; }; return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()); }
  var log = store('log') || [];
  function checkIn(day) { var date = today(); if (!log.some(function (c) { return c.date === date && c.day === day; })) { log.push({ date: date, day: day }); store('log', log); store('pending', (store('pending') || []).concat([{ date: date, day: day }])); } renderLog(); flush(); }
  function flush() { var pend = store('pending') || []; if (solo || !pend.length) return;  // on her own, check-ins wait on the phone
    token(true).then(function (t) { return retry(function () { return api('/rest/v1/checkins?on_conflict=user_id,course,day,on_date', { method: 'POST', token: t, prefer: 'resolution=ignore-duplicates,return=minimal', body: pend.map(function (c) { return { course: 'mum', day: c.day, on_date: c.date }; }) }); }); })
      .then(function () { var left = (store('pending') || []).filter(function (c) { return !pend.some(function (p) { return p.date === c.date && p.day === c.day; }); }); store('pending', left); }).catch(function () {}); }
  // always visible, so a parent can see where check-in is (it happens by itself on the last step of a day).
  // Opened, it is a month calendar: every day she checked in is a green stamp, with her streak and totals.
  function ymd(d) { var p = function (n) { return (n < 10 ? '0' : '') + n; }; return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()); }
  function logDates() { var set = {}; log.forEach(function (c) { set[c.date] = true; }); return set; }
  function streak(set) { var d = new Date(); if (!set[ymd(d)]) d.setDate(d.getDate() - 1); var n = 0; while (set[ymd(d)]) { n++; d.setDate(d.getDate() - 1); } return n; }
  var calMonth = today().slice(0, 7);
  function calHtml(month, set, nav) {
    var y = +month.slice(0, 4), m = +month.slice(5, 7), first = new Date(y, m - 1, 1), n = new Date(y, m, 0).getDate(), lead = (first.getDay() + 6) % 7, t = today(), cells = '', inMonth = 0;
    for (var k = 0; k < lead; k++) cells += '<span></span>';
    for (var dd = 1; dd <= n; dd++) { var key = month + '-' + (dd < 10 ? '0' : '') + dd, on = !!set[key]; if (on) inMonth++;
      cells += '<span class="' + (on ? 'on' : '') + (key === t ? ' today' : '') + '">' + dd + '</span>'; }
    var first0 = Object.keys(set).sort()[0], canPrev = nav && first0 && first0.slice(0, 7) < month, canNext = nav && month < t.slice(0, 7);
    return '<div class="cal"><div class="cal-head">' + (nav ? '<button type="button" data-cal="-1"' + (canPrev ? '' : ' disabled') + ' aria-label="上个月">‹</button>' : '') +
      '<b>' + y + ' 年 ' + m + ' 月</b>' + (nav ? '<button type="button" data-cal="1"' + (canNext ? '' : ' disabled') + ' aria-label="下个月">›</button>' : '') + '</div>' +
      '<div class="cal-grid wk"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>' +
      '<div class="cal-grid">' + cells + '</div><p class="cal-sum">这个月打卡 <b>' + inMonth + '</b> 天</p></div>'; }
  function renderLog() { var el = document.getElementById('log'), set = logDates(), total = Object.keys(set).length, open = el.open, ok = !!set[today()], run = streak(set);
    el.className = 'log' + (ok ? ' ok' : ' todo');
    el.innerHTML = '<summary>' + (ok ? '今天打过卡了 ✓' : '今天还没打卡') + (total ? '<span class="sum-note">' + (run > 1 ? '连续 ' + run + ' 天' : '一共 ' + total + ' 天') + ' · 点开看日历</span>' : '') + '</summary>' +
      (total ? calHtml(calMonth, set, true) + '<p class="cal-sum">一共学了 <b>' + total + '</b> 天' + (run ? '，现在连续 <b>' + run + '</b> 天' : '') + '</p>' : '');
    el.open = open; }

  // each day is a row of steps shown one at a time: review, say, questions, listening quiz, dialogue, done
  function strip(zh) { return zh.replace(/（.*?）/g, '').replace(/[。！]$/, ''); }
  function rand(seed) { return function () { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }; }
  function shuffle(a, r) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(r() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function stepsFor(i) { var d = DAYS[i], st = [], r = rand(i + 7);
    if (!d.review) { var back = [], k = i - 1; while (k >= 0 && back.length < 2) { if (!DAYS[k].review) back.push(k); k--; }
      back.forEach(function (b, n) { DAYS[b].say.slice(n ? -1 : -2).forEach(function (s) { st.push({ t: 'review', s: s, from: b }); }); }); }
    d.say.forEach(function (s) { st.push({ t: 'say', s: s }); });
    d.hear.forEach(function (h) { st.push({ t: 'hear', h: h }); });
    var pool = []; DAYS.slice(0, i + 1).forEach(function (x) { x.say.forEach(function (s) { pool.push(strip(s[1])); }); x.hear.forEach(function (h) { pool.push(strip(h.q[1])); }); });
    var qs = d.hear.map(function (h) { return h.q; }).concat(shuffle(d.say, r).slice(0, 2).map(function (x) { return [x[0], x[1], x[3]]; }));  // say items are [en, zh, hint, audio]
    shuffle(qs, r).forEach(function (q) { var right = strip(q[1]), others = shuffle(pool.filter(function (p, n) { return p !== right && pool.indexOf(p) === n; }), r).slice(0, 2);
      st.push({ t: 'quiz', q: q, right: right, opts: shuffle([right].concat(others), r) }); });
    st.push({ t: 'talk' }, { t: 'end' }); return st; }

  // where she was (day and step) is kept on the phone, so leaving WeChat or a reload does not start the day over
  var done = store('done') || [], at = store('at'), cur = 0, steps = [], pos = 0, items = [];
  while (cur < DAYS.length - 1 && done.indexOf(cur) >= 0) cur++;
  if (at && DAYS[at.day] && done.indexOf(at.day) < 0) cur = at.day; else at = null;
  function sayBlock(s) { return '<div class="en">' + esc(s[0]) + '</div><div class="zh">' + esc(s[1]) + '</div><div class="hint">大概读音：' + esc(s[2]) + '（以录音为准）</div>' +
    '<div class="btns"><button type="button" class="listen">听</button><button type="button" class="slow">慢一点</button><button type="button" class="rec">跟着说</button></div><div data-replies="' + esc(s[0]).replace(/"/g, '&quot;') + '"></div>'; }
  function card(s, before) { return '<section class="card" data-i="' + (items.push(s) - 1) + '">' + (before || '') + sayBlock(s) + '</section>'; }
  function openDay(i, p) { stopAll(); cur = i; steps = stepsFor(i); pos = Math.min(p || 0, steps.length - 1); render(); }
  function render() {
    document.getElementById('days').innerHTML = DAYS.map(function (d, i) { return '<button type="button" data-day="' + i + '" class="' + (i === cur ? 'on ' : '') + (done.indexOf(i) >= 0 ? 'done' : '') + '" aria-label="第 ' + (i + 1) + ' 天">' + (i + 1) + '</button>'; }).join('');
    var d = DAYS[cur], s = steps[pos], body; items = [];
    if (s.t === 'review') body = card(s.s, '<div class="kind">复习：第 ' + (s.from + 1) + ' 天学过的</div>');
    else if (s.t === 'say') body = card(s.s, '<div class="kind">跟着说</div>');
    else if (s.t === 'hear') body = card(s.h.a, '<div class="kind">别人可能会问你</div><div class="who">对方问：</div><div class="en">' + esc(s.h.q[0]) + '</div><div class="zh">' + esc(s.h.q[1]) + '</div>' +
      '<div class="btns"><button type="button" data-src="' + s.h.q[2] + '">听</button><button type="button" data-src="' + s.h.q[2] + '" data-rate="0.7">慢一点</button></div><div class="who ask">你可以这样答：</div>');
    else if (s.t === 'quiz') body = '<section class="card"><div class="kind">听一听，是什么意思？</div><div class="btns"><button type="button" class="listen" data-src="' + s.q[2] + '">再听一遍</button><button type="button" data-src="' + s.q[2] + '" data-rate="0.7">慢一点</button></div>' +
      '<div class="opts">' + s.opts.map(function (o) { var cls = s.picked === undefined ? '' : o === s.right ? 'right' : o === s.picked ? 'wrong' : ''; return '<button type="button" data-opt="' + esc(o) + '" class="' + cls + '">' + esc(o) + '</button>'; }).join('') + '</div>' +
      (s.picked !== undefined ? '<p class="zh">' + (s.picked === s.right ? '对了！' : '没关系，正确的是绿色那个。') + '英文是：<b>' + esc(s.q[0]) + '</b></p>' : '') + '</section>';
    else if (s.t === 'talk') body = '<section class="card"><div class="kind">小对话</div>' + '<div class="btns"><button type="button" class="listen" id="talk-all">听整段</button><button type="button" id="talk-me">我来演「你」</button></div><p class="hint">先听几遍整段（会一直重复，听够了点「停止」），再点「我来演」：对方说完，轮到你时停下来，你自己说。</p>' + d.talk.map(function (l) {
        return '<div class="line ' + l[0] + '"><div class="who">' + (l[0] === 'me' ? '你' : '对方') + '</div><div class="en">' + esc(l[1]) + '</div><div class="zh">' + esc(l[2]) + '</div></div>'; }).join('') +
      '</section>';
    else { var set = logDates(), run = streak(set); body = '<section class="card" style="text-align:center"><div class="done-big">🎉</div><h2>第 ' + (cur + 1) + ' 天学完了</h2>' + (run > 1 ? '<p class="streak">已经连续打卡 ' + run + ' 天！</p>' : '') + '<p class="zh">已经打卡了 ✓ ' + (solo ? '记在你的手机上。' : '孩子能看到你今天学了。') + '</p>' + calHtml(today().slice(0, 7), set, false) + '<p class="muted">想多练，就点上面的数字再来一遍。</p>' +
      (cur < DAYS.length - 1 ? '<button class="big" type="button" id="nextday">接着学第 ' + (cur + 2) + ' 天</button>' : '') + '</section>'; }
    document.getElementById('main').innerHTML = (pos === 0 ? '<div class="note"><h2>第 ' + (cur + 1) + ' 天：' + esc(d.title) + '</h2><p>' + esc(d.tip) + '</p></div>' : '<h2>第 ' + (cur + 1) + ' 天：' + esc(d.title) + '</h2>') +
      '<div><div class="bar"><i style="width:' + Math.round((pos + 1) / steps.length * 100) + '%"></i></div><p class="muted" style="font-size:17px;margin-top:4px">第 ' + (pos + 1) + ' 步，一共 ' + steps.length + ' 步' + (log.some(function (c) { return c.date === today(); }) ? '' : '，最后一步自动打卡') + '</p></div>' + body +
      (s.t === 'end' ? (pos ? '<div class="nav"><button class="big back" type="button" id="prev">上一个</button></div>' : '') : '<div class="nav">' + (pos ? '<button class="big back" type="button" id="prev">上一个</button>' : '<span></span>') + '<button class="big" type="button" id="next">下一个</button></div>');
    var on = document.querySelector('.days .on'); if (on) on.scrollIntoView({ inline: 'center', block: 'nearest' });
    showReplies(); window.scrollTo(0, 0); store('at', { day: cur, pos: pos });
  }
  // reaching the last step is the check-in: no button to forget
  function finish() { if (done.indexOf(cur) < 0) { done.push(cur); store('done', done); } checkIn(cur + 1); note('打卡了，真棒！'); }
  function go(k) { stopAll(); pos = k; if (steps[pos].t === 'end') finish(); render(); var s = steps[pos];
    if (s.t === 'review' || s.t === 'say') play(s.s[3]); else if (s.t === 'hear') play(s.h.q[2]); else if (s.t === 'quiz' && s.picked === undefined) play(s.q[2]); }

  var recording = null;
  function stopRec() { if (recording && recording.r.state !== 'inactive') recording.r.stop(); }
  function startRec(btn, s) {
    if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder)) { note('录不了也没关系，跟着大声说就行'); return; }
    seq++; clearLine(); player.pause();
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
      var type = ['audio/webm', 'audio/mp4', 'audio/ogg'].filter(function (t) { return MediaRecorder.isTypeSupported(t); })[0];
      var r = type ? new MediaRecorder(stream, { mimeType: type }) : new MediaRecorder(stream), chunks = [];
      r.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };
      r.onstop = function () { stream.getTracks().forEach(function (t) { t.stop(); }); clearTimeout(recording.timer); recording = null; btn.classList.remove('on'); btn.textContent = '跟着说';
        if (!chunks.length) { note('没录到声音，再试一次'); return; }
        var blob = new Blob(chunks, { type: chunks[0].type || type || 'audio/webm' }), mine = new Audio(URL.createObjectURL(blob));
        var send = btn.parentNode.querySelector('.send'); if (solo) {} else if (!send) { send = document.createElement('button'); send.type = 'button'; send.className = 'send'; btn.parentNode.appendChild(send); }
        if (send) { send.textContent = '发给孩子听听'; send.disabled = false; send._blob = blob; send._en = s[0]; }
        note('先听你说的…', true); mine.onended = function () { note('再听标准的'); play(s[3]); }; mine.play().catch(function () { play(s[3]); }); };
      recording = { r: r, timer: setTimeout(stopRec, 12000) }; r.start(); btn.classList.add('on'); btn.textContent = '说完点这里'; note('正在录，说完再点一下', true);
    }).catch(function () { note('录不了也没关系，跟着大声说就行。想录的话，手机问能不能用麦克风时选“允许”。'); });
  }
  function sendRec(b) { var mime = (b._blob.type || 'audio/webm').split(';')[0], ext = { 'audio/mp4': 'm4a', 'audio/ogg': 'ogg' }[mime] || 'webm', t, day = cur + 1; b.disabled = true; b.textContent = '发送中…';
    token(true).then(function (tok) { t = tok; var path = uid(t) + '/' + Date.now() + '.' + ext; return retry(function () { return fetch(SB + '/storage/v1/object/recordings/' + path, { method: 'POST', headers: { apikey: SBK, Authorization: 'Bearer ' + t, 'Content-Type': mime }, body: b._blob }).then(function (r) { if (!r.ok) { var e = new Error('http'); e.status = r.status; throw e; } return path; }); }); })
    .then(function (path) { return retry(function () { return api('/rest/v1/submissions', { method: 'POST', token: t, prefer: 'return=minimal', body: { day: day, text: b._en, kind: 'speak', audio: path, course: 'mum' } }); }); })
    .then(function () { b.textContent = '发过去了 ✓'; note('发过去了，回复会出现在这句下面'); return loadMine(); })
    .catch(function () { b.disabled = false; b.textContent = '发给孩子听听'; note('没发出去，等网好一点再试'); }); }
  document.addEventListener('click', function (ev) {
    var dayBtn = ev.target.closest('[data-day]'); if (dayBtn) { openDay(Number(dayBtn.getAttribute('data-day'))); return; }
    var id = ev.target.id;
    if (id === 'next') { go(pos + 1); return; } if (id === 'prev') { go(pos - 1); return; }
    if (id === 'nextday') { openDay(cur + 1); return; }
    var cm = ev.target.getAttribute('data-cal'); if (cm) { var dt = new Date(+calMonth.slice(0, 4), +calMonth.slice(5, 7) - 1 + Number(cm), 1); calMonth = ymd(dt).slice(0, 7); renderLog(); return; }
    if (id === 'bg-start') { runBg(0); return; } if (id === 'bg-stop') { stopAll(); return; }
    if (id === 'talk-all' && looping) { stopAll(); return; }
    if (id === 'talk-all' || id === 'talk-me') { runTalk(id === 'talk-me'); return; }
    var opt = ev.target.closest('[data-opt]'); if (opt) { var s = steps[pos]; if (s.picked === undefined) { s.picked = opt.getAttribute('data-opt'); render(); if (s.picked !== s.right) play(s.q[2]); } return; }
    var ra = ev.target.getAttribute('data-ra'); if (ra) { playStored(ra); return; }
    var src = ev.target.getAttribute('data-src'); if (src) { play(src, Number(ev.target.getAttribute('data-rate')) || 1); return; }
    var c = ev.target.closest('[data-i]'); if (!c) return; var it = items[Number(c.getAttribute('data-i'))], cl = ev.target.classList;
    if (cl.contains('listen')) play(it[3]); else if (cl.contains('slow')) play(it[3], 0.7);
    else if (cl.contains('rec')) { if (recording) stopRec(); else startRec(ev.target, it); }
    else if (cl.contains('send')) sendRec(ev.target);
  });
  if (solo) document.getElementById('privacy').textContent = '你学到哪、哪天打了卡，都只记在这台手机上，不会发到网上。';
  openDay(cur, at && at.pos); renderLog(); renderBg(); setupFamily().then(function () { loadMine(); flush(); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { loadMine(); flush(); if (bg) runBg(bgAt); } });
})();
</script></body></html>
