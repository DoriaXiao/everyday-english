<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>每天学一点英语</title>
<style>
/* v3 layout (2026-11-21), same as the mini program: a home page, then one screen per step with one big button.
   The learners are parents in their 50s and 60s: big text, big buttons, little to read. */
:root { --ink:#1f2a24; --muted:#5d6a62; --paper:#fbfaf5; --card:#fff; --line:#dcd9cc; --green:#2c6e49; --soft:#e6f1ea; --red:#b3392f; --redsoft:#f8e3e0; --yellow:#fff6d9; --gold:#d9a400 }
[hidden] { display:none !important }
* { box-sizing:border-box } body { margin:0; background:var(--paper); color:var(--ink); font:19px/1.6 -apple-system,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif }
p, h1, h2 { margin:0 } .muted { color:var(--muted) } .green { color:var(--green) } .b { font-weight:700 } .center { text-align:center } .big { font-size:20px }
button { font:inherit; color:inherit; cursor:pointer } button:focus-visible { outline:3px solid var(--gold); outline-offset:2px }
.view { max-width:520px; margin:0 auto; min-height:100vh; min-height:100dvh; padding:10px 18px 0; display:flex; flex-direction:column }
.mid { flex-grow:1; display:flex; flex-direction:column; justify-content:center; gap:16px; padding:8px 0 16px }
.primary { display:block; width:100%; min-height:72px; border:0; border-radius:20px; background:var(--green); color:#fff; font-size:26px; font-weight:800 }
.primary.red { background:var(--red) }
.secondary { display:block; width:100%; min-height:56px; border:2px solid var(--green); border-radius:18px; background:#fff; color:var(--green); font-size:20px; font-weight:700 }
.secondary.on { background:var(--red); border-color:var(--red); color:#fff }
.link { border:0; background:none; color:var(--green); font-size:18px; min-height:44px; padding:0 }
.bar { position:sticky; bottom:0; background:var(--paper); padding:10px 0 calc(16px + env(safe-area-inset-bottom)) }
.msg { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(110px + env(safe-area-inset-bottom)); background:var(--ink); color:var(--paper); padding:12px 18px; border-radius:999px; width:max-content; max-width:calc(100% - 32px); text-align:center; z-index:9 }
select { font:inherit; font-size:20px; width:100%; min-height:56px; padding:0 14px; border:1px solid var(--line); border-radius:12px; background:#fff; color:var(--ink) }
/* home */
.day-n { font-size:44px; font-weight:800; line-height:1.2 } .day-t { font-size:36px; font-weight:800; line-height:1.2 }
.dots { display:flex; gap:9px; justify-content:center } .dot { width:36px; height:36px; border-radius:50%; background:#e9e6da; color:var(--muted); font-size:15px; display:flex; align-items:center; justify-content:center }
.dot.on { background:var(--green); color:#fff; font-weight:700 } .dot.today { box-shadow:inset 0 0 0 3px var(--gold) }
.links { display:flex; justify-content:space-between; padding:14px 0 calc(16px + env(safe-area-inset-bottom)) }
.inbox { background:var(--yellow); border:2px solid var(--gold); border-radius:16px; padding:14px 16px; display:grid; gap:10px; margin-top:8px }
.reply { background:var(--soft); border-radius:10px; padding:10px 12px }
/* lesson */
.top { display:flex; align-items:center; gap:8px; min-height:44px } .top .link { width:64px; text-align:left } .top .link.r { text-align:right }
.pdots { flex:1; min-width:0; display:flex; gap:3px; justify-content:center } .pd { flex:1 1 0; max-width:18px; height:8px; border-radius:4px; background:var(--line) } .pd.on { background:var(--green) }
.tag { font-size:18px; color:var(--green); font-weight:700 }
.en { font-size:30px; font-weight:700; line-height:1.3 } .zh { font-size:23px }
.kw { background:var(--yellow); font-weight:800; padding:0 4px; border-radius:5px }
.tip { font-size:17px; color:var(--muted); background:#f1efe6; border-radius:10px; padding:10px 12px }
.speaker { align-self:center; width:128px; height:128px; border-radius:50%; border:3px solid var(--green); background:var(--soft); color:var(--green); font-size:18px; font-weight:800; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px }
.speaker .ic { font-size:36px; line-height:1 }
.word { display:flex; align-items:center; gap:14px; width:100%; padding:8px 14px; background:#fff; border:1px solid var(--line); border-radius:14px; text-align:left }

.bubble.me { align-self:flex-end; background:var(--green); color:#fff; border-bottom-right-radius:5px }

.opt.right { border-color:var(--green); background:var(--soft) } .opt.wrong { border-color:var(--red); background:var(--redsoft) }
.match { display:grid; grid-template-columns:1fr 1fr; gap:12px } .col { display:grid; gap:12px; align-content:start }
.mb { min-height:64px; padding:8px 10px; border-radius:14px; border:2px solid var(--line); background:#fff; font-size:20px; line-height:1.3 }
.mb.ma { color:var(--green); font-weight:700 } .mb.sel { border-color:var(--gold); background:var(--yellow) } .mb.ok { border-color:var(--green); background:var(--soft); color:var(--ink) } .mb.dim { opacity:.35 }
.two { display:grid; grid-template-columns:1fr 1fr; gap:12px }
.line { padding:8px 12px; border-radius:12px } .line.me .who { color:var(--green); opacity:1; font-weight:700 } .l-en { font-size:22px; font-weight:700 } .line.now { background:var(--yellow) }
.done-t { font-size:36px; font-weight:800 }
.cert { border:3px double var(--gold); background:#fffaf0; border-radius:14px; padding:18px; text-align:center; display:grid; gap:8px }
.cert-t { font-size:32px; font-weight:800; color:var(--red); letter-spacing:8px } .cert-b { font-size:22px; font-weight:800 } .cert-s { font-size:17px; color:var(--muted) }
.share { border:0; border-radius:16px; background:var(--gold); color:#fff; font-size:20px; font-weight:800; min-height:52px }
.send { align-self:center; border:2px solid var(--green); border-radius:999px; background:var(--soft); color:var(--green); font-weight:700; min-height:48px; padding:0 20px }
/* list and settings */
.rows { display:grid; gap:10px; padding:8px 0 24px } .row { display:flex; align-items:center; gap:14px; min-height:60px; padding:0 14px; background:#fff; border:1px solid var(--line); border-radius:14px; width:100%; text-align:left }
.card { background:#fff; border:1px solid var(--line); border-radius:14px; overflow:hidden } .card .row { border:0; background:transparent } .card.now { border:2px solid var(--green); background:var(--soft) } .card.lock { background:transparent; border-style:dashed; color:#b9b4a8 } .card.now .st { color:var(--green); font-weight:700 }

.sheet .sec-t { font-size:18px; font-weight:800; color:var(--green); margin-top:10px } .sheet .word { margin-top:8px } .s-en { font-size:22px; font-weight:700; line-height:1.3 }
.row .num { width:36px; font-size:22px; font-weight:800; text-align:center } .row .t { flex-grow:1; font-size:20px } .row .st { font-size:16px; color:var(--muted) } .row.now .st { color:var(--green); font-weight:700 }
.set { display:grid; gap:14px; padding:12px 0 24px } .h1 { font-size:28px; font-weight:800 }
/* what is playing right now lights up, so she can see the tap worked */
.playing { background:var(--yellow) !important; box-shadow:inset 0 0 0 2px var(--gold) !important }
.speaker.playing { box-shadow:0 0 0 8px #f6e7b3 !important; border-color:var(--gold) }
.bubble.me.playing { background:#24593b !important; box-shadow:0 0 0 4px #f6e7b3 !important }
.on-play { display:none } .playing .on-play { display:inline } .playing .off-play { display:none }

        (l.key !== '数字' ? '<p class="muted center">听到 <b>' + esc(l.key) + '</b> 就知道在问什么</p>' : '') + (l.do ? '<p class="muted center">' + esc(l.do) + '</p>' : '') +
        (l.lines.length > 1 ? '<button class="secondary" type="button" id="more">换一种说法再听</button>' : ''); }
    else if (s.t === 'say') { var cue = s.cue || [];
      body = (s.from !== undefined ? '<p class="green b">复习：第 ' + (s.from + 1) + ' 天学过的</p>' : '') + (cue[1] ? '<p class="muted big">' + esc(cue[1]) + '</p>' : '') +
        (cue[0] ? '<button type="button" class="bubble them" data-k="cue" id="cue"><span class="who-row"><span class="who">对方说</span>' + pill() + '</span><span class="b-en" style="display:block">' + esc(cue[0]) + '</span></button>' : '') +
        '<button type="button" class="bubble me" data-k="model" id="model"><span class="who-row"><span class="who">你说</span>' + pill() + '</span><span class="b-en" style="display:block">' + esc(s.s[0]) + '</span><span class="b-zh">' + esc(s.s[1]) + '</span></button>' +
        '<div data-replies="' + esc(s.s[0]).replace(/"/g, '&quot;') + '"></div>' +
        '<div class="row-links"><button class="link" type="button" id="hint">' + (showHint ? '收起读音' : '不会读？看中文读音') + '</button><button class="link" type="button" id="slow">慢一点</button></div>' +
        (showHint ? '<p class="hint">' + esc(s.s[2]) + '</p>' : '') +
        '<button type="button" class="mic" id="mic">按住说</button><p class="muted center">按住说，松开听自己的</p>' + (solo ? '' : '<button type="button" class="send" id="send" hidden>发给孩子听听</button>'); }
    else if (s.t === 'quiz') body = '<p class="muted big center">' + (s.rv ? '上次没听出来的，再听一次：' : '听一听，他在说什么？') + '</p><button type="button" class="speaker" data-k="spk" id="q"><span class="ic">🔊</span><span class="off-play">再听一遍</span><span class="on-play">正在放</span></button>' +
      s.opts.map(function (o) { var cls = s.picked === undefined ? '' : o === s.right ? ' right' : o === s.picked ? ' wrong' : ''; return '<button type="button" class="opt' + cls + '" data-opt="' + esc(o) + '">' + esc(o) + '</button>'; }).join('') +
      (s.picked !== undefined ? '<p class="zh center">' + (s.picked === s.right ? '对了！' : '没关系，正确的是绿色那个。') + '<b>' + esc(s.q[0]) + '</b></p>' : '');
    else if (s.t === 'match') { var all = s.pairs.every(function (p, n) { return s.ok[n]; });
      body = '<p class="muted big">配一配：先点左边听，再点右边的意思</p><div class="match"><div class="col">' +
        s.left.map(function (k, n) { return '<button type="button" class="mb ma' + (s.ok[k] ? ' ok' : '') + (s.sel === k ? ' sel' : '') + '" data-k="m' + k + '" data-ma="' + k + '">' + (s.ok[k] ? esc(s.pairs[k][0]) + ' = ' + esc(s.pairs[k][1]) : '听第 ' + (n + 1) + ' 个') + '</button>'; }).join('') + '</div><div class="col">' +
        s.right.map(function (k) { return '<button type="button" class="mb' + (s.ok[k] ? ' ok dim' : '') + '" data-mb="' + k + '"' + (s.ok[k] ? ' disabled' : '') + '>' + esc(s.pairs[k][1]) + '</button>'; }).join('') + '</div></div>' +
        (all ? '<p class="zh center green b">全配对了，真棒！</p>' : ''); }
    else if (s.t === 'talk') body = '<p class="muted big">小对话：先听几遍，再自己演「你」</p><div class="two"><button class="secondary" type="button" id="talk-all">听整段</button><button class="secondary" type="button" id="talk-me">我来演</button></div>' +
      d.talk.map(function (l) { return '<div class="line ' + l[0] + '"><div class="who">' + (l[0] === 'me' ? '你' : '对方') + '</div><div class="l-en">' + esc(l[1]) + '</div><div class="b-zh">' + esc(l[2]) + '</div></div>'; }).join('');
    else { var known = sentencesKnown(), fresh = known - sentencesKnown(done.filter(function (x) { return x !== cur; })), run = streak(logSet()), wk = d.review ? Math.floor(cur / PER_WEEK) + 1 : 0, nd = nextDay();
      var topics = wk ? DAYS.slice((wk - 1) * PER_WEEK, wk * PER_WEEK).filter(function (x) { return !x.review; }).map(function (x) { return x.title; }).join('、') : '';
      body = '<div class="center" style="display:grid;gap:10px"><div class="done-t">第 ' + (cur + 1) + ' 天学完了！</div><p class="zh">' + (fresh ? '今天又学会 ' + fresh + ' 句' : '今天复习了 ' + d.say.length + ' 句') + '，现在一共会说 <b class="green">' + known + '</b> 句英语</p>' +
        (run > 1 ? '<p class="green b big">已经连续学了 ' + run + ' 天</p>' : '') + (solo ? '' : '<p class="muted">孩子能看到你今天学了</p>') + '</div>' +
        (wk ? '<div class="cert"><div class="cert-t">奖 状</div><div class="cert-b">恭喜你学完第 ' + wk + ' 周！</div><div class="cert-s">现在会说 ' + known + ' 句英语，学过：' + esc(topics) + '</div><button type="button" class="share" id="share" data-text="我完成了探亲英语第 ' + wk + ' 周！已经会说 ' + known + ' 句英语了">发给家人看看</button></div>' : '') +
        (nd !== cur ? '<button class="secondary" type="button" data-go="#day-' + nd + '">接着学第 ' + (nd + 1) + ' 天</button>' : ''); }
    var total = steps.length - 1;
    app.innerHTML = '<section class="view"><div class="top"><button class="link" type="button" data-go="#home">‹ 首页</button><div class="pdots" role="img" aria-label="第 ' + (pos + 1) + ' 步，共 ' + total + ' 步">' +
      steps.slice(0, -1).map(function (x, k) { return '<span class="pd' + (k <= pos ? ' on' : '') + '"></span>'; }).join('') + '</div><button class="link r" type="button" id="prev"' + (pos > 0 && s.t !== 'end' ? '' : ' hidden') + '>上一步</button></div>' +
      '<div class="mid">' + body + '</div><div class="bar"><button class="primary" type="button" id="main">' + (s.t === 'listen' ? '听懂了，下一个' : s.t === 'end' ? '回到首页' : '下一个') + '</button></div></section>';
    showReplies(); window.scrollTo(0, 0); if (s.t !== 'end') store('at', { day: cur, pos: pos });
  }
  function rerender() { var y = window.scrollY; render(); window.scrollTo(0, y); if (playingKey) lit(playingKey); }
  function autoplay() { var s = steps[pos]; if (!s) return;
    if (s.t === 'say') { if (s.cue && s.cue[2]) playSeq([s.cue[2], s.s[3]], ['cue', 'model']); else play(s.s[3], 1, 'model'); }
    else if (s.t === 'words') playWords();
    else if (s.t === 'listen') play(s.l.lines[s.li][1], 1, 'spk');
    else if (s.t === 'quiz' && s.picked === undefined) play(s.q[2], 1, 'spk'); }
  function playWords() { var w = DAYS[cur].words; playSeq(w.map(function (x) { return x[4]; }), w.map(function (x, i) { return 'w' + i; })); }
  function step(k) { stopAll(); showHint = false; pos = k; if (steps[pos].t === 'end') finish(); render(); autoplay(); }
  // reaching the last step is the check-in: no button to forget
  function finish() { if (done.indexOf(cur) < 0) { done.push(cur); store('done', done); } checkIn(cur + 1); store('at', null); }

  // 干活时听: the day's words, heard lines, answers, sentences and dialogue, each said twice, over and over.
  function endBg() { if (!bg) return; bg = false; if (wake) { wake.release().catch(function () {}); wake = null; } }
  function runBg() { stopAll(); bg = true; var d = DAYS[cur], list = [], my = seq;
    (d.words || []).forEach(function (w) { list.push([w[0], w[1], w[4]]); });
    d.listen.forEach(function (l) { l.lines.forEach(function (x) { list.push([x[0], l.zh, x[1]]); }); if (l.reply) list.push([l.reply[0], l.reply[1], l.reply[3]]); });
    d.say.forEach(function (s) { list.push([s[0], s[1], s[3]]); }); d.talk.forEach(function (l) { list.push([l[1], l[2], l[3]]); });
    if (navigator.wakeLock && !wake) navigator.wakeLock.request('screen').then(function (w) { if (bg) wake = w; else w.release(); }).catch(function () {});
    app.innerHTML = '<section class="view"><div class="mid center"><p class="muted big">正在放第 ' + (cur + 1) + ' 天「' + esc(d.title) + '」</p><p class="muted">每句说两遍，手机屏幕别关，放旁边就行</p><p class="en" id="bg-en"></p><p class="zh" id="bg-zh"></p></div><div class="bar"><button class="primary red" type="button" data-go="#home">停止</button></div></section>';
    function next(j, rep) { if (my !== seq || !bg) return; if (j >= list.length) j = 0; var it = list[j]; document.getElementById('bg-en').textContent = it[0]; document.getElementById('bg-zh').textContent = it[1];
      sound(it[2], 1, '', function () { setTimeout(function () { if (rep === 0) next(j, 1); else next(j + 1, 0); }, rep === 0 ? 1500 : 2500); }); }
    next(0, 0); }

  // dialogue: 听整段 repeats until tapped again; 我来演 leaves her lines as a pause
  function runTalk(mine) { stopAll(); var my = seq, lines = DAYS[cur].talk, els = document.querySelectorAll('.line');
    if (!mine) { looping = true; var b = document.getElementById('talk-all'); if (b) { b.textContent = '停止'; b.classList.add('on'); } }
    function next(j) { if (msgEl.textContent === '轮到你说了') msgEl.hidden = true; if (my !== seq) return; clearLine(); if (j >= lines.length) { if (!mine) { setTimeout(function () { if (my === seq) next(0); }, 1500); return; } note('演完了，点「听整段」对一对'); return; }
      els[j].classList.add('now'); var l = lines[j];
      if (mine && l[0] === 'me') { note('轮到你说了', true); setTimeout(function () { next(j + 1); }, 2500 + 700 * l[1].split(' ').length); return; }
      sound(l[3], 1, '', function () { setTimeout(function () { next(j + 1); }, 500); }); }
    next(0); }

  // follow along: hold to record, release to hear herself and then the model; in a family she can send it to the child
  var recording = null, recBlob = null, holding = false;
  function stopRec() { holding = false; if (recording && recording.r.state !== 'inactive') recording.r.stop(); }
  function startRec() { var s = steps[pos].s, btn = document.getElementById('mic');
    if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder)) { note('录不了也没关系，跟着大声说就行'); return; }
    stopAll(); holding = true;
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
      var type = ['audio/webm', 'audio/mp4', 'audio/ogg'].filter(function (t) { return MediaRecorder.isTypeSupported(t); })[0];
      var r = type ? new MediaRecorder(stream, { mimeType: type }) : new MediaRecorder(stream), chunks = [], t0 = Date.now();
      r.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };
      r.onstop = function () { stream.getTracks().forEach(function (t) { t.stop(); }); clearTimeout(recording.timer); recording = null; if (btn) { btn.classList.remove('on'); btn.textContent = '按住说'; }
        if (!chunks.length || Date.now() - t0 < 500) { note('按住别松手，说完再松开'); return; }
        recBlob = new Blob(chunks, { type: chunks[0].type || type || 'audio/webm' }); var mine = new Audio(URL.createObjectURL(recBlob)), send = document.getElementById('send');
        if (send) { send.hidden = false; send.disabled = false; send.textContent = '发给孩子听听'; send._en = s[0]; }
        note('先听你说的…', true); mine.onended = function () { note('再听标准的'); play(s[3], 1, 'model'); }; mine.play().catch(function () { play(s[3], 1, 'model'); }); };
      recording = { r: r, timer: setTimeout(stopRec, 12000) }; r.start(); if (btn) { btn.classList.add('on'); btn.textContent = '松开'; } note('正在录，说完松开', true);
      if (!holding) stopRec();  // let go before the microphone was ready
    }).catch(function () { holding = false; note('录不了也没关系，跟着大声说就行。想录的话，手机问能不能用麦克风时选「允许」。'); });
  }
  function sendRec(b) { var mime = (recBlob.type || 'audio/webm').split(';')[0], ext = { 'audio/mp4': 'm4a', 'audio/ogg': 'ogg' }[mime] || 'webm', t, day = cur + 1, blob = recBlob; b.disabled = true; b.textContent = '发送中…';
    token(true).then(function (tok) { t = tok; var path = uid(t) + '/' + Date.now() + '.' + ext; return retry(function () { return fetch(SB + '/storage/v1/object/recordings/' + path, { method: 'POST', headers: { apikey: SBK, Authorization: 'Bearer ' + t, 'Content-Type': mime }, body: blob }).then(function (r) { if (!r.ok) { var e = new Error('http'); e.status = r.status; throw e; } return path; }); }); })
    .then(function (path) { return retry(function () { return api('/rest/v1/submissions', { method: 'POST', token: t, prefer: 'return=minimal', body: { day: day, text: b._en, kind: 'speak', audio: path, course: 'mum' } }); }); })
    .then(function () { b.textContent = '发过去了 ✓'; note('发过去了，孩子的回复会出现在这句下面'); return loadMine(); })
    .catch(function () { b.disabled = false; b.textContent = '发给孩子听听'; note('没发出去，等网好一点再试'); }); }
  function shareCert(b) { var text = b.getAttribute('data-text'), url = location.origin + location.pathname;
    if (navigator.share) { navigator.share({ title: '探亲英语', text: text, url: url }).catch(function () {}); return; }
    var done2 = function () { note('已经复制好了，打开微信粘贴发给家人'); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text + ' ' + url).then(done2, function () { note(text); }); else note(text); }

  document.addEventListener('pointerdown', function (ev) { if (ev.target.closest('#mic')) { ev.preventDefault(); startRec(); } });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (t) { document.addEventListener(t, function (ev) { if (holding && (t !== 'pointerleave' || ev.target.closest && ev.target.closest('#mic'))) stopRec(); }, true); });
  document.addEventListener('contextmenu', function (ev) { if (ev.target.closest('#mic')) ev.preventDefault(); });
  document.addEventListener('click', function (ev) { var t = ev.target, el;
    if ((el = t.closest('[data-go]'))) { go(el.getAttribute('data-go')); return; }
    if ((el = t.closest('[data-open]'))) { var i = Number(el.getAttribute('data-open')); if (locked(i)) { note('先学完前面的课'); return; } go('#day-' + i); return; }
    if ((el = t.closest('[data-ra]'))) { playStored(el.getAttribute('data-ra')); return; }
    var id = (t.closest('[id]') || {}).id, s = steps[pos];
    if (id === 'setup-go') { var n = Number(document.getElementById('s-start').value); store('prefs', { who: document.getElementById('s-who').value, stay: document.getElementById('s-stay').value }); DAYS = resolve(RAW, prefs()); if (n > 0) startFrom(n); store('setup', 1); renderHome(); return; }
    if (view === 'sheet') { if (id === 'sheet-all') { if (looping) stopAll(); else runSheet(); return; } if ((el = t.closest('[data-sheet]'))) { var it = sheetList[Number(el.getAttribute('data-sheet'))]; play(it[0], 1, it[1]); } return; }
    if (view !== 'lesson') return;
    if (id === 'main') { if (s.t === 'end') go('#home'); else step(pos + 1); return; }
    if (id === 'prev') { if (pos > 0) step(pos - 1); return; }
    if (id === 'replay') { play(s.l.lines[s.li][1], 1, 'spk'); return; }
    if (id === 'more') { s.li = (s.li + 1) % s.l.lines.length; rerender(); play(s.l.lines[s.li][1], 1, 'spk'); return; }
    if (id === 'q') { play(s.q[2], 1, 'spk'); return; }
    if (id === 'all-words') { playWords(); return; }
    if ((el = t.closest('[data-word]'))) { var wi = Number(el.getAttribute('data-word')); play(DAYS[cur].words[wi][4], 1, 'w' + wi); return; }
    if (id === 'cue') { if (s.cue && s.cue[2]) play(s.cue[2], 1, 'cue'); return; }
    if (id === 'model') { play(s.s[3], 1, 'model'); return; }
    if (id === 'slow') { play(s.s[3], 0.7, 'model'); return; }
    if (id === 'hint') { showHint = !showHint; rerender(); return; }
    if (id === 'send') { sendRec(document.getElementById('send')); return; }
    if (id === 'share') { shareCert(document.getElementById('share')); return; }
    if (id === 'talk-all') { if (looping) stopAll(); else runTalk(false); return; }
    if (id === 'talk-me') { runTalk(true); return; }
    if ((el = t.closest('[data-opt]'))) { if (s.picked === undefined) { s.picked = el.getAttribute('data-opt'); if (s.id) mark(s.id, s.picked === s.right); rerender(); if (s.picked !== s.right) play(s.q[2], 1, 'spk'); } return; }
    if ((el = t.closest('[data-ma]'))) { var k = Number(el.getAttribute('data-ma')); play(s.pairs[k][2], 1, 'm' + k); if (!s.ok[k]) { s.sel = k; rerender(); } return; }
    if ((el = t.closest('[data-mb]'))) { var kb = Number(el.getAttribute('data-mb'));
      if (s.sel === null) { note('先点左边，听一听'); return; }
      if (kb === s.sel) { s.ok[kb] = true; s.sel = null; mark('M' + cur + '-' + kb, !s.miss[kb]); note(s.pairs.every(function (p, n) { return s.ok[n]; }) ? '全配对了，真棒！' : '对了！'); }
      else { s.miss[s.sel] = true; note('不对，再听一遍'); play(s.pairs[s.sel][2], 1, 'm' + s.sel); }
      rerender(); return; }
  });
  document.addEventListener('change', function (ev) { var id = ev.target.id;
    if (id === 'p-who' || id === 'p-stay') { var p = prefs(); p[id === 'p-who' ? 'who' : 'stay'] = ev.target.value; store('prefs', { who: p.who, stay: p.stay }); DAYS = resolve(RAW, prefs()); note('改好了'); }
    if (id === 'p-start') { var n = Number(ev.target.value); if (n <= firstOpen()) { note('第 ' + (n + 1) + ' 天已经打开了，去「全部课程」点它就能学'); ev.target.value = firstOpen(); return; }
      if (confirm('从第 ' + (n + 1) + ' 天开始学？第 1 到 ' + n + ' 天会标成「学过了」，以后也可以回去重学。')) { startFrom(n); note('好了，从第 ' + (n + 1) + ' 天开始'); } else ev.target.value = firstOpen(); }
  });

  route(); setupFamily().then(function () { loadMine(); flush(); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { loadMine(); flush(); } });
})();
</script></body></html>
