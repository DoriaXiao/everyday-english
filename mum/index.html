<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>每天学一点英语</title>
<style>
:root { --ink:#1f2a24; --muted:#5d6a62; --paper:#fbfaf5; --card:#fff; --line:#dcd9cc; --green:#2c6e49; --soft:#e6f1ea; --red:#b3392f; --redsoft:#f8e3e0; --yellow:#fff6d9 }
[hidden] { display:none !important }
* { box-sizing:border-box } body { margin:0; background:var(--paper); color:var(--ink); font:19px/1.6 -apple-system,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif }
.wrap { max-width:560px; margin:0 auto; padding:18px 16px 60px; display:grid; gap:16px }
h1 { margin:0; font-size:24px } h2 { margin:0; font-size:22px } p { margin:0 } .muted { color:var(--muted) }
.days { display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none } .days button { flex:none; min-width:52px; height:48px; border:1px solid var(--line); background:var(--card); border-radius:12px; font:inherit; color:var(--ink) }
.days button.on { background:var(--green); color:#fff; border-color:var(--green) } .days button.done::after { content:" ✓" }
.days button.lock { color:#b9b4a8; background:transparent; border-style:dashed }
.card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; display:grid; gap:10px }
.en { font-size:28px; font-weight:700; line-height:1.3 } .zh { font-size:21px } .hint { color:var(--muted); font-size:18px }
.btns { display:flex; flex-wrap:wrap; gap:10px } .btns button, .big { min-height:54px; padding:0 18px; border-radius:14px; border:1px solid var(--green); background:var(--card); color:var(--green); font:inherit; font-weight:700 }
.btns .listen, .big { background:var(--green); color:#fff } .btns .rec.on, .btns .listen.on { background:var(--red); border-color:var(--red); color:#fff } .btns .send { background:var(--soft) } button:disabled { opacity:.6 }
.note { background:var(--soft); border-radius:14px; padding:14px 16px; display:grid; gap:4px } .reply { background:var(--soft); border-radius:10px; padding:10px 12px }
.msg { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(96px + env(safe-area-inset-bottom)); background:var(--ink); color:var(--paper); padding:12px 18px; border-radius:999px; width:max-content; max-width:calc(100% - 32px); text-align:center; z-index:5 }
.inbox { background:var(--yellow); border:2px solid #d9a400; border-radius:16px; padding:14px 16px; display:grid; gap:10px }

.kind { color:var(--green); font-size:18px; font-weight:700 } .who { color:var(--muted); font-size:18px; font-weight:700 } .ask { border-top:1px dashed var(--line); padding-top:10px }
.line { padding:8px 10px; border-radius:10px; display:grid; gap:2px } .line .en { font-size:22px } .line.me .who { color:var(--green) } .line.now { background:var(--yellow) }

.cal-grid span { aspect-ratio:1; display:flex; align-items:center; justify-content:center; border-radius:50%; font-size:17px; color:var(--muted) }
.cal-grid span.on { background:var(--green); color:#fff; font-weight:700 } .cal-grid span.today { box-shadow:0 0 0 3px #d9a400 }
.sum-note { font-weight:400; color:var(--muted); font-size:17px } .streak { font-size:24px; font-weight:700; color:var(--green) }

.key { font-size:22px } .key b { color:var(--green); font-size:26px }

    .catch(function () { b.disabled = false; b.textContent = '发给孩子听听'; note('没发出去，等网好一点再试'); }); }
  document.addEventListener('click', function (ev) {
    var dayBtn = ev.target.closest('[data-day]'); if (dayBtn) { var di = Number(dayBtn.getAttribute('data-day')); if (locked(di)) { note('先学完第 ' + (firstOpen() + 1) + ' 天，这一天才会打开'); return; } openDay(di); return; }
    var id = ev.target.id;
    if (id === 'next') { go(pos + 1); return; } if (id === 'prev') { go(pos - 1); return; }
    if (id === 'nextday') { openDay(nextDay()); return; }
    var cm = ev.target.getAttribute('data-cal'); if (cm) { var dt = new Date(+calMonth.slice(0, 4), +calMonth.slice(5, 7) - 1 + Number(cm), 1); calMonth = ymd(dt).slice(0, 7); renderLog(); return; }
    if (id === 'bg-start') { runBg(0); return; } if (id === 'bg-stop') { stopAll(); return; }
    if (id === 'talk-all' && looping) { stopAll(); return; }
    if (id === 'talk-all' || id === 'talk-me') { runTalk(id === 'talk-me'); return; }
    if (id === 'all-words') { playSeq(DAYS[cur].words.map(function (w) { return w[4]; })); return; }
    if (id === 'all-lines') { playSeq(steps[pos].l.lines.map(function (x) { return x[1]; })); return; }
    var ma = ev.target.closest('[data-ma]'); if (ma) { var sm = steps[pos], k = Number(ma.getAttribute('data-ma')); play(sm.pairs[k][2]); if (!sm.ok[k]) { sm.sel = k; render(true); } return; }
    var mb = ev.target.closest('[data-mb]'); if (mb) { var sb = steps[pos], kb = Number(mb.getAttribute('data-mb'));
      if (sb.sel === null) { note('先点左边的喇叭听一听'); return; }
      if (kb === sb.sel) { sb.ok[kb] = true; sb.sel = null; note(sb.pairs.every(function (p, n) { return sb.ok[n]; }) ? '全配对了，真棒！' : '对了！'); } else { note('不对，再听一遍'); play(sb.pairs[sb.sel][2]); }
      render(true); return; }
    var opt = ev.target.closest('[data-opt]'); if (opt) { var s = steps[pos]; if (s.picked === undefined) { s.picked = opt.getAttribute('data-opt'); render(true); if (s.picked !== s.right) play(s.q[2]); } return; }
    var ra = ev.target.getAttribute('data-ra'); if (ra) { playStored(ra); return; }
    var se = ev.target.closest('[data-src]'); if (se) { play(se.getAttribute('data-src'), Number(se.getAttribute('data-rate')) || 1); return; }
    var c = ev.target.closest('[data-i]'); if (!c) return; var it = items[Number(c.getAttribute('data-i'))], cl = ev.target.classList;
    if (cl.contains('listen')) play(it[3]); else if (cl.contains('slow')) play(it[3], 0.7);
    else if (cl.contains('rec')) { if (recording) stopRec(); else startRec(ev.target, it); }
    else if (cl.contains('send')) sendRec(ev.target);
  });
  if (solo) document.getElementById('privacy').textContent = '你学到哪、哪天打了卡，都只记在这台手机上，不会发到网上。';
  openDay(cur, at && at.pos); renderLog(); renderBg(); setupFamily().then(function () { loadMine(); flush(); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { loadMine(); flush(); if (bg) runBg(bgAt); } });
})();
</script></body></html>
