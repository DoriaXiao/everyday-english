      '<section class="card' + (fresh ? ' hi' : '') + '"><h2>把这个链接发给' + name + '</h2><p class="link">' + esc(parentLink()) + '</p><div class="row"><button class="btn main" type="button" data-copy="p">复制链接</button></div>' +
        '<p class="muted small">复制的内容会带一句怎么用。用微信发过去，' + name + '点开就能学，不用注册。</p>' +
        '<details><summary>还要发给别的家人？</summary><p class="muted small">每人一个链接，各自的打卡和录音会分开显示。写上你怎么称呼 TA，再复制发过去。</p>' +
          '<label>怎么称呼<input id="o-name" maxlength="10" placeholder="比如：爸爸"></label><div class="row"><button class="btn" type="button" data-copy="o">复制给 TA 的链接</button></div></details></section>' +
      ps.map(function (p) { return checkCard(p, checks.filter(function (c) { return whoOf(c.user_id) === p; })); }).join('') +
      '<section class="card"><h2>' + all + '的录音' + (todo ? ' <span class="tag">' + todo + ' 条没回</span>' : '') + '</h2>' + (recs.length ? recs.map(function (s) { return recCard(s, multi); }).join('') : '<p class="muted">还没有录音。' + all + '跟读时点「发给孩子听听」，录音会出现在这里。</p>') + '</section>' +
      '<details class="card"><summary>设置</summary>' + settingsForm(fam) + '<button class="btn" type="button" id="save">保存</button>' +
        '<p class="muted small">你自己的链接（换手机时打开它，别发给别人）：</p><p class="link">' + esc(myLink()) + '</p><div class="row"><button class="btn" type="button" data-copy="k">复制我的链接</button></div></details>' + PRIVACY;
  }
  function fmt(d) { return Number(d.slice(5, 7)) + ' 月 ' + Number(d.slice(8)) + ' 日'; }
  function recCard(s, multi) { var when = new Date(s.created_at), who = whoOf(s.user_id);
    return '<div class="rec" data-id="' + s.id + '" data-who="' + esc(who) + '"><div class="row"><span class="muted small">' + (multi ? esc(who) + ' · ' : '') + '第 ' + s.day + ' 天 · ' + (when.getMonth() + 1) + ' 月 ' + when.getDate() + ' 日</span>' + (s.reply ? '' : '<span class="tag">没回</span>') + '</div>' +
      '<div class="en">' + esc(s.text) + '</div><div class="row"><button class="btn main" type="button" data-play="' + esc(s.audio) + '">听' + esc(who) + '读的</button>' + (MODEL[s.text] ? '<button class="btn" type="button" data-model="' + esc(MODEL[s.text]) + '">听标准读音</button>' : '') + '</div>' +
      (s.reply ? '<div class="reply">你回复：' + esc(s.reply) + (s.reply_audio ? ' <button class="btn" type="button" data-play="' + esc(s.reply_audio) + '">听我的语音</button>' : '') + '</div>'
        : '<textarea placeholder="写一句，比如：读得很好！thank 的舌头再伸出来一点"></textarea><div class="row"><button class="btn" type="button" data-rec>录一段语音</button><button class="btn main" type="button" data-send>发送</button></div>') + '</div>'; }

  function load() { return token().then(function (t) { return Promise.all([
      api('/rest/v1/submissions?select=id,user_id,day,text,kind,audio,reply,reply_audio,created_at&course=eq.mum&order=created_at.asc', { token: t }),
      api('/rest/v1/checkins?select=user_id,day,on_date&course=eq.mum&order=on_date.asc', { token: t }),
      api('/rest/v1/rpc/family_members', { method: 'POST', token: t, body: {} }).catch(function () { return []; })]); })
    .then(function (r) { subs = r[0] || []; checks = r[1] || []; members = r[2] || []; render(); }).catch(function () { render(); note('没连上，等网好一点再刷新'); }); }
  function stored(path) { return token().then(function (t) { return fetch(SB + '/storage/v1/object/authenticated/recordings/' + path, { headers: { apikey: SBK, Authorization: 'Bearer ' + t } }); })
    .then(function (r) { if (!r.ok) throw new Error('http'); return r.blob(); }); }

  var recording = null;
  function toggleRec(btn) {
    if (recording) { recording.r.stop(); return; }
    if (!(navigator.mediaDevices && window.MediaRecorder)) { note('这个浏览器录不了音'); return; }
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
      var type = ['audio/webm', 'audio/mp4', 'audio/ogg'].filter(function (t) { return MediaRecorder.isTypeSupported(t); })[0], chunks = [];
      var r = type ? new MediaRecorder(stream, { mimeType: type }) : new MediaRecorder(stream);
      r.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };
      r.onstop = function () { stream.getTracks().forEach(function (t) { t.stop(); }); clearTimeout(recording.timer); recording = null; btn.classList.remove('on');
        if (!chunks.length) { btn.textContent = '录一段语音'; return; }
        btn._blob = new Blob(chunks, { type: chunks[0].type || type || 'audio/webm' }); btn.textContent = '重录'; play(URL.createObjectURL(btn._blob)); note('录好了，点「发送」一起发过去'); };
      recording = { r: r, timer: setTimeout(function () { r.stop(); }, 60000) }; r.start(); btn.classList.add('on'); btn.textContent = '说完点这里';
    }).catch(function () { note('要允许使用麦克风才能录'); });
  }
  function send(card) { var id = card.getAttribute('data-id'), text = card.querySelector('textarea').value.trim(), blob = card.querySelector('[data-rec]')._blob, btn = card.querySelector('[data-send]');
    if (!text && !blob) { note('写一句或者录一段再发'); return; }
    btn.disabled = true; btn.textContent = '发送中…';
    token().then(function (t) {
      var up = Promise.resolve(null);
      if (blob) { var mime = (blob.type || 'audio/webm').split(';')[0], path = uid(t) + '/reply-' + Date.now() + '.' + ({ 'audio/mp4': 'm4a', 'audio/ogg': 'ogg' }[mime] || 'webm');
        up = retry(function () { return fetch(SB + '/storage/v1/object/recordings/' + path, { method: 'POST', headers: { apikey: SBK, Authorization: 'Bearer ' + t, 'Content-Type': mime }, body: blob }).then(function (r) { if (!r.ok) { var e = new Error('http'); e.status = r.status; throw e; } return path; }); }); }
      return up.then(function (path) { return retry(function () { return api('/rest/v1/submissions?id=eq.' + id, { method: 'PATCH', token: t, prefer: 'return=representation', body: { reply: text || '（语音回复）', replied_at: new Date().toISOString(), reply_audio: path } }); }); });
    }).then(function (r) { if (!r || !r.length) throw new Error('none'); note('发过去了，' + (card.getAttribute('data-who') || fam.parent_name) + '打开页面就能看到'); return load(); })
      .catch(function () { btn.disabled = false; btn.textContent = '发送'; note('没发出去，再试一次'); }); }

  document.addEventListener('click', function (ev) { var t = ev.target;
    if (t.id === 'create') { t.disabled = true; rpc('create_family', readSettings()).then(function (f) { fam = f; store('family', f); history.replaceState(null, '', 'kid.html?k=' + f.child_key); load(); }).catch(function () { t.disabled = false; note('没建成，等网好一点再试'); }); return; }
    if (t.id === 'save') { rpc('update_family', readSettings()).then(function (f) { fam = f; store('family', f); render(); note('保存好了'); }).catch(function () { note('没保存上，再试一次'); }); return; }
    var c = t.getAttribute('data-copy'); if (c) { var other = c === 'o' ? document.getElementById('o-name').value.trim().slice(0, 10) : ''; if (c === 'o' && !other) { note('先写上怎么称呼 TA'); return; }
      var txt = c === 'k' ? myLink() : (other || fam.parent_name || '妈妈') + '，这是学英语的小课，点开就能学，不用注册：\n' + parentLink() + (other ? '&n=' + encodeURIComponent(other) : '') + '\n每次打开，一直点「下一个」，点到最后就学完了。';
      (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(function () { note('复制好了，去微信粘贴'); }, function () { note('复制不了，长按上面的链接复制'); }); return; }
    var p = t.getAttribute('data-play'); if (p) { stored(p).then(function (b) { play(URL.createObjectURL(b)); }).catch(function () { note('放不出来，等网好一点再试'); }); return; }
    var m = t.getAttribute('data-model'); if (m) { play(m); return; }
    if (t.hasAttribute('data-rec')) { toggleRec(t); return; }
    if (t.hasAttribute('data-send')) send(t.closest('.rec'));
  });
  var k = new URLSearchParams(location.search).get('k'), saved = store('family');
  rpc('join_family', k ? { p_child_key: k } : {}).then(function (f) {
    if (f && f.role === 'child') { fam = f; store('family', f); if (!k) history.replaceState(null, '', 'kid.html?k=' + f.child_key); load(); }
    else if (saved && saved.child_key) rpc('join_family', { p_child_key: saved.child_key }).then(function (f2) { if (f2) { fam = f2; load(); } else renderCreate(); });
    else renderCreate();
  }).catch(function () { document.getElementById('app').innerHTML = '<p class="muted">没连上，等网好一点再刷新。</p>'; });
  document.addEventListener('visibilitychange', function () { if (!document.hidden && fam && !recording && ![].some.call(document.querySelectorAll('textarea, #o-name'), function (x) { return x.value.trim(); })) load(); });  // never wipe a half-written reply
})();
</script></body></html>
