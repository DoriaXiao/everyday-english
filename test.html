<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>连接测试 · 每日一句</title>
<style>
:root { --bg: #f2f4f1; --paper: #fbfcfa; --ink: #1d2a26; --muted: #5d6b66; --line: #d6ddd8; --gum: #2f6b5a; --bad: #b5523b; --warn: #b7791f; color-scheme: light }
@media (prefers-color-scheme: dark) { :root { --bg: #121916; --paper: #19221e; --ink: #e6ece9; --muted: #9aaaa3; --line: #2c3833; --gum: #7cc2a8; --bad: #e58d76; --warn: #f0b85a; color-scheme: dark } }
* { box-sizing: border-box }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, Roboto, "HarmonyOS Sans SC", "MiSans", "PingFang SC", "Noto Sans CJK SC", sans-serif; font-size: 17px; line-height: 1.6 }
.wrap { max-width: 560px; margin: 0 auto; padding: 28px 16px 48px; display: grid; gap: 18px }
h1 { font-size: 26px; margin: 0 }
p { margin: 0; color: var(--muted) }
.row { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; justify-content: space-between; gap: 12px; align-items: center }
.row b { font-weight: 600 }
.st { font-weight: 700; white-space: nowrap }
.ok { color: var(--gum) } .bad { color: var(--bad) } .slow { color: var(--warn) }
.summary { font-size: 20px; font-weight: 700; text-align: center; padding: 12px }
button { font: inherit; border: 0; border-radius: 12px; padding: 14px; background: #2f6b5a; color: #fbfcfa; font-weight: 600; cursor: pointer }
.ghost { background: transparent; color: var(--gum); border: 1px solid var(--line) }
textarea { width: 100%; min-height: 90px; font: 13px ui-monospace, monospace; border: 1px solid var(--line); border-radius: 10px; padding: 10px; background: var(--paper); color: var(--ink) }
</style>
</head>
<body>
<div class="wrap">
  <h1>连接测试</h1>
  <p>测一下你的手机能不能连上以后“交作业、马上批改”要用的服务器。打开页面会自动测三轮，大概十几秒。测完点下面的按钮，把结果复制发给我。</p>
  <div class="row"><b>服务器 1（批改用）</b><span class="st" id="s1">测试中…</span></div>
  <div class="row"><b>服务器 2（存作业用）</b><span class="st" id="s2">测试中…</span></div>
  <div class="summary" id="sum"></div>
  <button type="button" id="copy">复制结果，发微信给我</button>
  <button type="button" class="ghost" id="again">再测一次</button>
  <textarea id="out" readonly aria-label="测试结果"></textarea>
</div>
<script>
(function () {
  var BASE = 'https://rrmfujomfedxxnchfcgi.supabase.co', KEY = 'sb_publishable_Jlfc5BOhR-UtmNmNc_FdjA_MImfGAfW';
  var tests = [
    { id: 's1', name: 'function', url: BASE + '/functions/v1/ping', headers: {} },
    { id: 's2', name: 'database', url: BASE + '/auth/v1/health', headers: { apikey: KEY } }
  ];
  var lines = [];
  function once(t) {
    var start = Date.now(), ctrl = ('AbortController' in window) ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 15000);
    return fetch(t.url + (t.url.indexOf('?') < 0 ? '?' : '&') + 't=' + start, { headers: t.headers, signal: ctrl ? ctrl.signal : undefined, cache: 'no-store' })
      .then(function (r) { clearTimeout(timer); return { ok: r.ok, ms: Date.now() - start, code: r.status }; })
      .catch(function (e) { clearTimeout(timer); return { ok: false, ms: Date.now() - start, code: (e && e.name) || 'error' }; });
  }
  function run() {
    lines = ['UA: ' + navigator.userAgent, 'time: ' + new Date().toString()];
    document.getElementById('sum').textContent = '';
    var results = {};
    var chain = Promise.resolve();
    tests.forEach(function (t) {
      document.getElementById(t.id).textContent = '测试中…';
      document.getElementById(t.id).className = 'st';
      results[t.id] = [];
      [1, 2, 3].forEach(function () {
        chain = chain.then(function () { return once(t).then(function (r) { results[t.id].push(r); lines.push(t.name + ': ' + (r.ok ? 'ok' : 'FAIL ' + r.code) + ' ' + r.ms + 'ms'); }); });
      });
      chain = chain.then(function () {
        var rs = results[t.id], good = rs.filter(function (r) { return r.ok; });
        var el = document.getElementById(t.id);
        if (!good.length) { el.textContent = '连不上 ✗'; el.className = 'st bad'; return; }
        var avg = Math.round(good.reduce(function (a, r) { return a + r.ms; }, 0) / good.length);
        var slow = avg > 3000 || good.length < rs.length;
        el.textContent = (slow ? '能连上，但慢 ' : '正常 ✓ ') + (avg / 1000).toFixed(1) + ' 秒';
        el.className = 'st ' + (slow ? 'slow' : 'ok');
      });
    });
    chain.then(function () {
      var bad = document.querySelectorAll('.st.bad').length, slow = document.querySelectorAll('.st.slow').length;
      document.getElementById('sum').textContent = bad ? '有服务器连不上' : slow ? '能用，但有点慢' : '全部正常，可以用！';
      document.getElementById('out').value = lines.join('\n');
    });
  }
  document.getElementById('again').onclick = run;
  document.getElementById('copy').onclick = function () {
    var ta = document.getElementById('out'), text = document.getElementById('sum').textContent + '\n' + ta.value;
    function fallback() { ta.focus(); ta.select(); var ok = false; try { ok = document.execCommand('copy'); } catch (e) {} if (!ok) alert('请长按下面的文字，选“复制”'); }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { document.getElementById('copy').textContent = '已复制 ✓'; }, fallback); else fallback();
  };
  run();
})();
</script>
</body>
</html>
